<!DOCTYPE html>
<html>
<head>
  <!-- Anti-cache meta headers para forzar actualización inmediata en navegadores -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LA CRIPTA - D&D 5e">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LA CRIPTA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LA CRIPTA</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Versión de despliegue para invalidación inmediata de caché en Cloudflare y navegadores
    window.__APP_VERSION__ = "20261019_lacripta_v2";

    // Purgar CacheStorage y Service Workers viejos
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }

    // Interceptar la inyección de main.dart.js para forzar cache-busting en Cloudflare Edge
    (function() {
      var origCreateElement = document.createElement.bind(document);
      document.createElement = function(tagName, options) {
        var el = origCreateElement(tagName, options);
        if (tagName && tagName.toLowerCase() === 'script') {
          var origSetAttribute = el.setAttribute.bind(el);
          var currentSrc = '';
          Object.defineProperty(el, 'src', {
            configurable: true,
            get: function() { return currentSrc; },
            set: function(url) {
              if (url && typeof url === 'string' && url.indexOf('main.dart.js') !== -1 && url.indexOf('?v=') === -1) {
                url = url + (url.indexOf('?') !== -1 ? '&' : '?') + 'v=' + window.__APP_VERSION__;
              }
              currentSrc = url;
              origSetAttribute('src', url);
            }
          });
        }
        return el;
      };
    })();

    // Garantizar que en todo momento el título de la pestaña del navegador sea 'LA CRIPTA'
    document.title = "LA CRIPTA";
    if (window.MutationObserver) {
      var _titleObserver = new MutationObserver(function() {
        if (document.title !== "LA CRIPTA") {
          document.title = "LA CRIPTA";
        }
      });
      _titleObserver.observe(document.querySelector('title') || document.head, {
        childList: true,
        subtree: true,
        characterData: true
      });
    }
    window.addEventListener('focus', function() { document.title = "LA CRIPTA"; });
    window.addEventListener('load', function() { document.title = "LA CRIPTA"; });
    window.addEventListener('popstate', function() { document.title = "LA CRIPTA"; });
  </script>
  <style>
    /* Estilos visuales inmediatos para evitar pantalla en blanco durante la carga del motor Flutter */
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #dfba73;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(223, 186, 115, 0.2);
      border-top-color: #dfba73;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loading-spinner"></div>
    <p style="margin-top: 16px; font-weight: 500; letter-spacing: 0.5px;">Cargando LA CRIPTA...</p>
  </div>
  <script src="flutter_bootstrap.js?v=20261019_lacripta_v2" async></script>
</body>
</html>

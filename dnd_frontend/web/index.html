<!DOCTYPE html>
<html>
<head>
  <!-- Anti-cache meta headers para forzar actualización inmediata en navegadores -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Plataforma D&D 5e">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dnd_frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Plataforma D&D</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Estilos visuales inmediatos para evitar pantalla en blanco durante la carga del motor Flutter */
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #dfba73;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
    }
    .loading-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(223, 186, 115, 0.2);
      border-top-color: #dfba73;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="loading-spinner"></div>
    <p style="margin-top: 16px; font-weight: 500; letter-spacing: 0.5px;">Cargando Plataforma D&amp;D...</p>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
